[default]
API_HOST = "127.0.0.1"
API_PORT = 8080
API_ROOT = ""
API_MODE = "DEV"
MODULE_NAME = "antikorr"
ROUTER_AI_BASE_URL = "https://routerai.ru/api/v1"
S3_SERVICE_BASE_URL = "https://s3-service.dv.gigalegal.tech/"
S3_SERVICE_META_PATH = "/s3/meta"
S3_SERVICE_EXISTS_PATH = "/s3/exists"
S3_SERVICE_UPLOAD_PATH = "/s3/upload"
S3_SERVICE_RETRY_ON_NOT_READY_ATTEMPTS = 5
S3_SERVICE_RETRY_ON_NOT_READY_WAIT_MULTIPLIER = 2
S3_SERVICE_RETRY_ON_NOT_READY_WAIT_MIN_SECONDS = 2
S3_SERVICE_RETRY_ON_NOT_READY_WAIT_MAX_SECONDS = 30

LOGLEVEL = "INFO"
LOG_RENDERER = "json"
LOG_SPLIT_STDERR = true
LOG_STDERR_FROM = "WARNING"
ENABLE_FILE_LOG = false
LOG_DIR = "logs"
APP_LOG_NAME = "app.log"
ERROR_LOG_NAME = "error.log"
SEPARATE_ERROR_LOG = true
LOG_ROTATION = "size"
LOG_MAX_BYTES = 52428800
LOG_BACKUP_COUNT = 5
LOG_WHEN = "midnight"
LOG_INTERVAL = 1
LOG_UTC = true
FORCE_LOGGING_CONFIG = false
LOG_CALLSITE = false
LOG_LLM_ONLY = true


PROXY_URL = ""

[default.app]
max_upload_mb = 100

[default.mcp]
# На сервер для всех экспертиз процесса, включая поиск, метаданные и чтение.
max_concurrent_calls = 10
card_search_tools = ["consultant_card_search", "CardSearch"]

[default.mcp.urls]
consultant = "consultant/mcp"

[default.agents.competence]

read_timeout_s = 60

max_sources = 7
parse_input_chars = 8000
source_attempt_s = 20
source_attempts = 2
max_source_paragraphs = 6000
verdict_input_chars = 400000

[default.agents.legal]
read_timeout_s = 60
llm_retries = 1
max_acts = 10
# Цель совместного смыслового отбора, а не обрезка первых N источников.
target_acts = 5
selection_block_chars = 1000
search_results_per_query = 10
relaxed_results_per_query = 5
max_source_paragraphs = 6000
source_attempt_s = 20
source_attempts = 2

[default.agents.internal]
limit_reason = "Детерминированная проверка ограничена отсылками, составом приложений, наименованием, сроками и значениями одной величины; смысловые противоречия не проверялись."



[default.agents.reference_currentness]
metadata_change_retries = 1

[default.agents.progress]
parse                = "Разбираю документ"
