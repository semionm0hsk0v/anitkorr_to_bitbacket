[default.infrastructure.mcp_servers.dependencies]
stop_timeout_s = 10.0
stop_dying_timeout_s = 1.0
death_grace_s = 0.1

[default.observability]
duration_buckets = [0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0, 120.0, 300.0, 420.0, 600.0, inf]

[default.agents.competence.evidence]
