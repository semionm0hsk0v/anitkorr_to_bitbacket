first_numbered_page = 2

[default.agents.legal.plan]
min_name_letters = 8
same_name_prefix_share = 0.8
default_rejection_text = "Не разрешён кандидат L1: {label} ({reason})."

[default.agents.legal.region_banks]
min_stem = 3



[default.agents.legal_base.retrieval]
page = 60
max_pars = 400
max_identity_title = 2000
max_identity_requisite = 256
max_identity_issuer = 1024

[default.agents.parse.act_basis]
preamble_window = 2500
preamble_tail = 1200

[default.agents.parse.context_basis]
