note_basis_limit = 5

[default.agents.parse.morphology]
min_stem = 4

[default.agents.utils.llm]
escalate_factor = 1.6
escalate_cap = 16384
token_step = 2048

[default.app.antikorr]
upload_chunk_bytes = 1048576

[default.app.intake]
head_chars = 400
max_intake_files = 5
project_threshold = 3
note_threshold = 2

[default.infrastructure.knowledge.organ_statutes]
