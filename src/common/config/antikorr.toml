[default.agents.internal.address_space]
item_text_lookahead = 3
max_caption_chars = 1500

[default.agents.internal.appendix_check]
form_proximity_window = 250
genus_anchor_gap = 3
genus_connector_max_gap = 15

[default.agents.internal.norm_params]
