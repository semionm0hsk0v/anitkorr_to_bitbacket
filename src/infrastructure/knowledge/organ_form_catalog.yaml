meta:
  source: "Требования модуля «Компетенция инициатора», таблица «Орган → Форма»"
  rule_pack_version: "organ-form-1"

bodies:
  - kind: legislature
    label: "Законодательное собрание (законодательный орган)"
    anchors: ["законодательное собрание", "законодательн", "государственное собрание"]
    forms: ["закон"]
  - kind: government
    label: "Правительство"
    anchors: ["правительств"]
    forms: ["постановление", "распоряжение"]
  - kind: governor
    label: "Высшее должностное лицо (Губернатор)"
    anchors: ["губернатор", "высшее должностное лицо", "глава республики", "глава администрации области"]
    forms: ["указ", "распоряжение"]
  - kind: ministry
    label: "Министерство"
    anchors: ["министерств"]
    forms: ["приказ", "распоряжение", "регламент"]
  - kind: agency
    label: "Агентство"
    anchors: ["агентств", "департамент", "служба", "комитет", "инспекци"]
    forms: ["приказ", "распоряжение"]
  - kind: audit_chamber
    label: "Контрольно-счётная палата"
    anchors: ["контрольно-счетн", "счетная палата", "счетн"]
    forms: ["распоряжение"]
  - kind: duma_chair
    label: "Председатель Думы (боковая ветвь при представительном органе)"
    anchors: ["председатель думы"]
    forms: ["распоряжение"]
  - kind: city_duma
    label: "Городская дума / Совет депутатов муниципального образования"
    anchors: ["городская дума", "дума муниципальн", "совет депутатов"]
    forms: ["решение"]
  - kind: city_admin
    label: "Глава города / Администрация города"
    anchors: ["глава город", "администрация город", "администрация муниципальн", "местная администраци"]
    forms: ["постановление", "распоряжение"]
