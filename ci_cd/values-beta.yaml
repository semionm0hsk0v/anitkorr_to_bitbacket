replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.org/client-max-body-size: "105m"
    nginx.org/proxy-max-temp-file-size: "105m"
    nginx.org/server-snippets: |
      # k8s internal
      allow 10.130.0.0/24;
      allow 10.10.0.0/16;
      allow 10.30.0.0/16;
      deny all;

  hosts:
    - host: antikorr.gigalegal.ru
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: gigalegal-ru
      hosts:
        - antikorr.gigalegal.ru

ingressClassName: "nginx"

env:

vaultToken: "vault-token-for-dynaconf"

config:
  KEYCLOAK_REALM: "my_dev_test"
  KEYCLOAK_URL: "https://keycloak.gigalegal.tech/"
  PROJECT_NAME: "antikorr_prod"
  PROJECT_TAG: "stand_cicd"
  PROMPTS_DIR: "'/app/src/agents/prompts'"
  ENV_FOR_DYNACONF: "antikorr"
  ENVVAR_PREFIX_FOR_DYNACONF: "false"
  VAULT_ENABLED_FOR_DYNACONF: "true"
  VAULT_URL_FOR_DYNACONF: "http://vault.vault.svc.cluster.local:8200"
  VAULT_KV_VERSION_FOR_DYNACONF: "2"
  API_MODE: "PROD"
  PORT: "8080"
  BASE_MCP_URL: "https://kb-mcp.gigalegal.ru"
  SETTINGS_FILES_FOR_DYNACONF: '["/app/src/common/config/antikorr.toml", "/app/src/common/config/antikorr_llms.toml"]'
  USE_KEYCLOAK: "false"
  API_ROOT: ""

serviceMonitor:
  enabled: true
  labels:
    release: prometheus-stack
  port: http
  path: /metrics
  interval: 15s

livenessProbe:
  httpGet:
    path: /health
    port: 8080
readinessProbe:
  httpGet:
    path: /health
    port: 8080
