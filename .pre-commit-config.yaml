default_language_version:
  python: python3.13


repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        exclude: ^tests/
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - types-PyYAML
          - types-python-dateutil
