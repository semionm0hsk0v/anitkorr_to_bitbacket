[project]
name = "antikorr"
version = "0.1.0"
description = "Antikorr — автоматизированная антикоррупционная экспертиза НПА"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dynaconf[vault]>=3.2.13",
    "fastapi>=0.121.2",
    "fastmcp>=3.4.7,<4",
    "httpx[socks]>=0.28.1",
    "langchain>=1.1.2",
    "langchain-openai>=1.0.3",
    "langchain-mcp-adapters>=0.1.9",
    "langgraph>=1.0.3",
    "mcp>=1.9.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.9.0",
    "python-dateutil>=2.9.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.12",
    "structlog>=25.5.0",
    "tenacity>=9.1.2",
    "uvicorn[standard]>=0.38.0",
    "langfuse>=3.1.0,<4",
]

[dependency-groups]
dev = [
    "PyMuPDF>=1.24.0",
    "import-linter>=2.0",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.1",
    "types-PyYAML>=6.0.0",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/agents", "src/infrastructure", "src/common", "src/skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 130
target-version = "py313"
extend-exclude = ["docs/", "tests/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
    "C90", # mccabe complexity
    "T20", # flake8-print
    "ERA", # eradicate
    "PL",  # pylint-подмножество
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "N818",
    "PLR0913",
    "N811",
    "ERA001",
    "PLR2004",
    "PLR0912",
    "PLR0911",
    "C901",
    "B904",
    "B008",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["T201", "B006"]
"tests/**" = ["PLC0415"]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["src"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
python_version = "3.13"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = false
